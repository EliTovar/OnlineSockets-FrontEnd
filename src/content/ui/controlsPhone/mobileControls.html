<!-- Controles táctiles móviles -->
<div id="touch-controls" class="fixed bottom-4 left-4 z-50 flex gap-3 flex-wrap sm:hidden">
  <button id="btn-up" class="btn btn-sm btn-neutral">↑</button>
  <div class="flex gap-3">
    <button id="btn-left" class="btn btn-sm btn-neutral">←</button>
    <button id="btn-down" class="btn btn-sm btn-neutral">↓</button>
    <button id="btn-right" class="btn btn-sm btn-neutral">→</button>
  </div>
  <button id="btn-jump" class="btn btn-sm btn-primary">⭡</button>
</div>
